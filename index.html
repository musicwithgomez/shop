<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Wall</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1fb;--card:#fff;--tx:#14161f;--mu:#7b8194;--ln:#e3e7f3;--ac:#3b6fe0}

:root[data-theme="dark"]{--bg:#12141b;--card:#1d2029;--tx:#f0f1f6;--mu:#98a0b5;--ln:#2b2f3a;--ac:#6b93f2}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:640px;margin:0 auto}main{padding:12px 14px 120px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,textarea,select{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;min-width:0;width:100%}
textarea{min-height:90px}button{cursor:pointer}
.hd{background:var(--h);color:#fff;padding:14px 16px 16px;position:relative;overflow:hidden;min-height:128px;border-radius:0 0 22px 22px}
.hd.lt{background:var(--card);color:var(--tx);min-height:0}.hd.lt .big{display:none}.hd.lt .ib{background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;position:relative;z-index:1}.top div{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:50%;background:#fff;border:0;font-size:17px;flex:none;color:#222}
.hd h1{margin:16px 0 4px;font-size:27px;position:relative;z-index:1}.big{position:absolute;right:14px;bottom:2px;font-size:62px}
.inner{position:relative;z-index:1}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h3{margin:0 0 4px}.mu{color:var(--mu);font-size:13px}.f{display:grid;gap:8px}
.btn{background:var(--h,var(--ac));color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.btn.r{background:#d9534f}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip{border:0;border-radius:20px;padding:6px 12px;color:#fff;font-size:13px;font-weight:600;background:var(--c)}
.chip.o{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.chip.o.on{background:var(--h);color:#fff;border-color:var(--h)}
.av{width:30px;height:30px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;font-size:16px;flex:none}
.fab{position:fixed;right:max(18px,calc(50% - 300px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--h);color:#fff;font-size:32px;border:0;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:5}
.homeh{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 0}.homeh h1{margin:0;font-size:30px}
.today{background:#4aa3e0;color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}.today h2{margin:0 0 8px}
.te{border-left:4px solid var(--c);padding:2px 10px;margin:8px 0}.te div{font-size:13px;opacity:.9}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:28px 14px 14px;user-select:none;-webkit-user-select:none;text-align:left;position:relative;min-height:88px;padding-right:56px}
.tile .th{position:absolute;left:8px;top:6px;touch-action:none;cursor:grab;color:var(--mu);opacity:.55;font-size:15px;padding:4px 8px 4px 4px;line-height:1;letter-spacing:-2px}.tile.dg{opacity:.65;outline:2px dashed var(--ac);z-index:3}.tile b{display:block}.tile span{font-size:13px;color:var(--mu)}.tile.off{opacity:.5}
.tile i{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-size:20px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.strip{display:flex;justify-content:space-between;margin-top:8px}.sd{background:none;border:0;display:grid;gap:2px;justify-items:center;padding:4px 8px;border-radius:10px;color:inherit}.sd small{opacity:.6}.sd.td{background:var(--bg)}.sd.on{background:var(--ac);color:#fff}
.cols{display:flex;gap:10px;overflow-x:auto;padding:6px 0}.col{min-width:46%;flex:none}.col .ph{display:flex;align-items:center;gap:6px;font-weight:700}
.add{width:100%;background:color-mix(in srgb,var(--ac) 15%,transparent);border:0;border-radius:10px;padding:6px;color:var(--ac);font-size:20px;margin:6px 0}
.ec{background:var(--c);color:#fff;border-radius:10px;padding:8px 10px;margin:6px 0;font-weight:600}.ec small{display:block;font-weight:400;opacity:.9}
.ar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:6px 12px;margin:10px 0}.ar input{border:0;background:none}
.cat{display:flex;align-items:center;gap:8px;margin:16px 4px 4px;font-weight:700;background:none;border:0;width:calc(100% - 8px);text-align:left}
.cat em{margin-left:auto;font-style:normal}
.it{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--ln);background:var(--card)}
.it .t{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}.it .t small{display:block;color:var(--mu)}
.it.dn .t b{text-decoration:line-through;opacity:.45}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:none;flex:none;color:#fff;display:grid;place-items:center;padding:0;font-size:14px}.dn .ck{background:var(--c)}
.bud{background:rgba(255,255,255,.16);border-radius:12px;padding:12px;margin-top:8px}.bud big{font-size:28px;font-weight:700;display:block}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#fff}
.card .bar{background:var(--ln)}.card .bar i{background:var(--ac)}
.ex{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;margin:6px 0;width:100%;text-align:left}
.ex .ic{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:20px}.ex .t{flex:1}.ex small{display:block;color:var(--mu)}
.gl{margin:14px 2px 2px;color:var(--mu);font-size:14px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;font-weight:600}.dh .x{background:none;border:0;color:var(--ac);font-size:22px}
.ml{background:var(--card);border-radius:12px;border-left:5px solid var(--c);padding:8px 12px;margin:6px 0;display:flex;gap:8px;align-items:center;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0}.ml div{flex:1}.ml small{color:var(--c);font-weight:600;display:block}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sh>div{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sh h3{margin:0 0 8px}.lb{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#23211d;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30}
.empty{text-align:center;color:var(--mu);padding:30px 10px}pre{white-space:pre-wrap;font:inherit;margin:8px 0}a{color:var(--ac)}
.rm{background:none;border:0;color:var(--mu);opacity:.4;font-size:15px;padding:6px 4px;flex:none}.rm:hover{opacity:.9}
.cr{display:flex;align-items:center;gap:8px;margin:6px 0}
#map{height:52vh;min-height:280px;border-radius:16px;position:relative;z-index:0;isolation:isolate;margin:10px 0;background:var(--ln);overflow:hidden}
.pin{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid #fff;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.35)}.pin.st{opacity:.55}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}}
.lm{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.lm:last-child{border:0}.lm .t{flex:1}.lm small{display:block;color:var(--mu)}
.dy{margin:18px 2px 6px;font-weight:700}.dy.td{color:var(--ac)}
.mh{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--mu);font-size:12px;margin-top:6px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:4px 0 6px}
.mc{background:var(--card);border:1px solid var(--ln);border-radius:10px;min-height:56px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.mc.o{opacity:.4}.mc.on{outline:2px solid var(--ac)}.mc.td b{background:var(--ac);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
</style></head><body><div id="app"></div><div id="shw"></div><input type="file" id="csvf" accept=".csv,.txt,text/csv" hidden>
<script>
window.fbRef=new Promise(r=>window._fbres=r);
async function getRef(){return Promise.race([window.fbRef,new Promise(r=>setTimeout(()=>r(null),8000))])}
const CATS={brood:['Brood & Gebak','#c98a3d','🥖'],groente:['Groente','#3f9d4f','🥦'],fruit:['Fruit','#e4572e','🍎'],zuivel:['Zuivel & Eieren','#4c8fd6','🥛'],vlees:['Vlees & Vis','#c2415d','🥩'],kaas:['Kaas & Beleg','#e0b01f','🧀'],houdbaar:['Houdbaar','#8b6b4a','🥫'],drank:['Dranken','#2aa5a5','🥤'],vries:['Diepvries','#6c7ae0','❄️'],snoep:['Snoep & Snacks','#d96bb0','🍫'],huis:['Huishouden','#7d8590','🧴'],overig:['Overig','#a0a0a0','📦']};
const KW={brood:'brood,bol,croissant,wrap,beschuit,pistolet,stokbrood,taart',groente:'sla,tomaat,komkommer,ui,knoflook,wortel,paprika,courgette,broccoli,spinazie,aardappel,champignon,prei,bloemkool,avocado',fruit:'appel,banaan,peer,citroen,sinaasappel,druif,aardbei,mango,kiwi,framboos,bosbes,meloen',zuivel:'melk,yoghurt,boter,ei,eieren,room,kwark,skyr,vla,havermelk',kaas:'kaas,ham,salami,hummus,pesto,pindakaas,jam,hagelslag',vlees:'kip,gehakt,vis,zalm,worst,spek,biefstuk,tonijn,garnaal,schnitzel',houdbaar:'pasta,rijst,meel,suiker,olie,saus,soep,bonen,linzen,muesli,cornflakes,koffie,thee,zout,peper',drank:'water,cola,bier,wijn,sap,frisdrank,limonade',vries:'ijs,pizza,diepvries,friet,doperwten',snoep:'chips,chocolade,koek,snoep,drop,noten',huis:'wc,afwas,zeep,shampoo,tandpasta,keukenrol,vuilzak,wasmiddel,spons,luiers'};
const BC={'Boodschappen':'🛒','Vaste lasten':'🏠','Vervoer':'🚗','Kinderen':'🧒','Vrije tijd':'🎉','Kleding':'👗','Salaris':'💼','Overig':'📦'};
const MT={b:['Ontbijt','#f0a07a'],l:['Lunch','#e8b92a'],d:['Diner','#2fa96b']};
const COL={home:'#3b6fe0',cal:'#3b6fe0',lists:'#6e78b8',budget:'#3b6fe0',meals:'#4a6fb5',tasks:'#4a9d6e',msgs:'#2aa5a5',recipes:'#e0883e',contacts:'#d96bb0',settings:'#6b7280',loc:'#e0614f'};
const MC=['#e4572e','#4c8fd6','#3f9d4f','#d96bb0','#e0b01f','#6c7ae0','#2aa5a5'];
const guess=n=>{n=n.toLowerCase();for(const k in KW)if(KW[k].split(',').some(w=>n.includes(w)))return k;return'overig'};
const uid=()=>Math.random().toString(36).slice(2,9),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()+n);return x};
const P=s=>new Date(s+'T12:00'),dl=(s,o)=>cap(P(s).toLocaleDateString('nl-NL',o));
const eur=n=>'€ '+Math.abs(n).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
let S={fam:'Ons gezin',items:[],recipes:[],meals:[],orders:[{id:'o1',name:'Standaard route',cats:Object.keys(CATS)}],active:'o1',theme:'auto',members:[{id:'m1',name:'Ik',color:'#e4572e',emoji:'🙂'},{id:'m2',name:'Partner',color:'#4c8fd6',emoji:'😀'}],events:[],tasks:[],msgs:[],contacts:[],exp:[],limits:{},budget:0,rules:{}};
let me='';try{me=localStorage.getItem('me')||''}catch(e){}
let lt='lijst',view='home',cd=ymd(new Date()),bm=0,bg='date',mw=0,tf='',col={},SH=null,ref=null,timer=null,dirty=false;
const mem=id=>S.members.find(m=>m.id===id)||{name:'?',color:'#999',emoji:'👤'};
const av=id=>`<span class="av" style="--c:${mem(id).color}" title="${esc(mem(id).name)}">${mem(id).emoji}</span>`;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1900)}
function save(){dirty=true;clearTimeout(timer);timer=setTimeout(async()=>{try{localStorage.setItem('bd',JSON.stringify(S))}catch(e){}if(ref){try{await ref.set(JSON.parse(JSON.stringify({...S,loc:undefined})))}catch(e){}}dirty=false},500)}
function theme(){document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme}
function norm(){S.loc=S.loc||{};['items','recipes','meals','events','tasks','msgs','contacts','exp'].forEach(k=>S[k]=S[k]||[]);S.limits=S.limits||{};S.tiles=S.tiles||[];S.rules=S.rules||{};S.budget=+S.budget||0;S.items=S.items.filter(i=>!i.h);S.recipes.forEach(r=>{if(!r.ings)r.ings=parseIng(r.ing||'')});
 if(S.plan){Object.entries(S.plan).forEach(([k,p])=>{if(p?.txt)S.meals.push({id:uid(),date:k,type:'d',txt:p.txt,rid:p.rid})});delete S.plan}
 if(!S.members?.length)S.members=[{id:'m1',name:'Ik',color:'#e4572e',emoji:'🙂'}];if(!S.members.find(m=>m.id===me))me=S.members[0].id;
 if(!S.orders?.length)S.orders=[{id:'o1',name:'Standaard route',cats:Object.keys(CATS)}];S.orders.forEach(o=>Object.keys(CATS).forEach(k=>{if(!o.cats.includes(k))o.cats.push(k)}));if(!S.orders.find(o=>o.id===S.active))S.active=S.orders[0].id}
const order=()=>S.orders.find(o=>o.id===S.active);
const evOn=d=>[...S.events,...G].filter(e=>e.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const evCol=e=>e.who?.length?mem(e.who[0]).color:(e.col||'#8a93a8'),tr=e=>e.time?e.time+(e.end?' - '+e.end:''):'Hele dag';
const mBal=p=>S.exp.filter(x=>x.date.startsWith(p)).reduce((a,x)=>a+(x.inc?x.amt:-x.amt),0);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n},fmtQ=n=>String(Math.round(n*100)/100);
function parseIng(t){return String(t||'').split('\n').map(s=>s.replace(/^[\s\-•*]+/,'').trim()).filter(Boolean).map(s=>{const m=s.match(/^(\d+\/\d+|\d+(?:[.,]\d+)?)\s*(?:x\s*)?(?:(?:gram|gr|g|kg|ml|cl|dl|l|el|tl|stuks?|blik(?:ken)?|teentjes?|bosjes?)\b\.?\s*)?(.+)$/i);if(!m)return{name:s,qty:''};let q=m[1];q=q.includes('/')?q.split('/')[0]/q.split('/')[1]:parseFloat(q.replace(',','.'));return{name:m[2].trim(),qty:fmtQ(q)}})}
const wkKey=s=>{const d=typeof s==='string'?P(s):s;return ymd(addDays(d,-((d.getDay()+6)%7)))},wasAdded=(r,k)=>(r.aw||[]).includes(k),mark=(r,k)=>{if(!wasAdded(r,k))r.aw=[...(r.aw||[]),k].slice(-12)};
const CONF='Ben je zeker dat je dit recept nog eens wilt toevoegen?\n\nDe ingrediënten zijn deze week al op de lijst gezet.';
function addRecipe(r){let c=0;(r.ings||[]).forEach(g=>{const nm=g.name.trim().toLowerCase();if(!nm)return;const q=num(g.qty),same=S.items.filter(i=>i.name.trim().toLowerCase()===nm),open=same.find(i=>!i.done),dn=same.find(i=>i.done);
 if(open){if(q)open.qty=fmtQ(num(open.qty)+q)}else if(dn){dn.done=false;dn.qty=q?fmtQ(q):''}else S.items.unshift({id:uid(),name:g.name.trim(),qty:q?fmtQ(q):'',cat:guess(g.name),done:false});c++});return c}
// ---------- bottom sheet ----------
function sheet(title,fields,vals,ok,del,extra){SH={title,fields,v:{...vals},ok,del,extra};drawSh()}
function syncSh(){SH.fields.forEach(f=>{if(f.t==='ings'){SH.v[f.id]=(SH.v[f.id]||[]).map((x,i)=>({name:document.getElementById('ign_'+i)?.value??x.name,qty:document.getElementById('igq_'+i)?.value??x.qty}));return}const e=document.getElementById('f_'+f.id);if(e)SH.v[f.id]=e.value})}
function drawSh(){if(!SH){$('#shw').innerHTML='';return}
 const fl=f=>{const v=SH.v[f.id];const l=`<label class="lb">${f.l}</label>`;
  if(f.t==='ings')return l+(v||[]).map((x,i)=>`<div class="cr"><input id="ign_${i}" value="${esc(x.name)}" placeholder="Ingrediënt" style="flex:1"><input id="igq_${i}" value="${esc(x.qty)}" inputmode="decimal" placeholder="Aantal" style="width:84px"><button class="ib" style="background:var(--bg)" data-a="igdel" data-id="${i}">✕</button></div>`).join('')+`<div class="row"><button class="btn g" data-a="igadd">➕ Ingrediënt</button></div>`;
  if(f.t==='area')return l+`<textarea id="f_${f.id}" placeholder="${f.p||''}">${esc(v)}</textarea>`;
  if(f.t==='select')return l+`<select id="f_${f.id}">${f.o.map(([k,n])=>`<option value="${esc(k)}" ${k===(v??'')?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
  if(f.t==='chips')return l+`<div class="row">${S.members.map(m=>`<button class="chip" style="--c:${m.color};opacity:${(v||[]).includes(m.id)?1:.35}" data-a="tg" data-f="${f.id}" data-id="${m.id}">${m.emoji} ${esc(m.name)}</button>`).join('')}</div>`;
  if(f.t==='pick')return l+`<div class="row">${f.o.map(([k,n,c])=>`<button class="chip" style="--c:${c||'#888'};opacity:${v===k?1:.35}" data-a="pk" data-f="${f.id}" data-id="${k}">${esc(n)}</button>`).join('')}</div>`;
  return l+`<input id="f_${f.id}" type="${f.t||'text'}" ${f.t==='number'?'step="0.01" inputmode="decimal"':''} value="${esc(v)}" placeholder="${f.p||''}">`};
 $('#shw').innerHTML=`<div class="sh" data-a="closesh"><div><h3>${esc(SH.title)}</h3>${SH.fields.map(fl).join('')}<div class="row" style="margin-top:14px"><button class="btn" data-a="oksh" style="flex:1">Opslaan</button>${SH.extra?`<button class="btn g" data-a="exsh">${SH.extra.l}</button>`:''}${SH.del?'<button class="btn r" data-a="delsh">🗑️</button>':''}</div></div></div>`}
const upsert=(arr,e,o)=>e.id?Object.assign(arr.find(x=>x.id===e.id),o):arr.push({id:uid(),...o});
